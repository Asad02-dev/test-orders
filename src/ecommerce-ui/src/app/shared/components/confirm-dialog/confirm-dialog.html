<div class="dialog-overlay animate-fadeIn" (click)="onBackdropClick($event)">
  <div class="dialog-card animate-scaleIn" [attr.data-type]="type()">
    <div class="dialog-header">
      <span class="dialog-icon">
        @switch (type()) {
          @case ('danger')  { ⚠️ }
          @case ('warning') { ⚡ }
          @default          { ℹ️ }
        }
      </span>
      <h3 class="dialog-title">{{ title() }}</h3>
    </div>

    <div class="dialog-body">
      <p>{{ message() }}</p>
    </div>

    <div class="dialog-footer">
      <button class="btn btn-secondary" (click)="onCancel()">{{ cancelText() }}</button>
      <button
        class="btn"
        [class.btn-danger]="type() === 'danger'"
        [class.btn-primary]="type() !== 'danger'"
        (click)="onConfirm()"
      >
        {{ confirmText() }}
      </button>
    </div>
  </div>
</div>
